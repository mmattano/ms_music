[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ms_music"
dynamic = ["version"]
description = "A Python package to generate audio from mass spectrometry data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matthias Anagho-Mattanovich", email = "matthias.mattanovich@sund.ku.dk" },
]
keywords = [
    "mass-spectrometry",
    "sonification",
    "audification",
    "audio",
    "midi",
    "bioinformatics",
    "data-visualization",
    "microtonality",
    "music-theory",
    "equal-temperament",
    "ion-mobility",
    "just-intonation",
    "experimental-music",
    "scientific-data",
    "quantization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Artistic Software",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "tqdm>=4.60.0",
    "pymzml>=2.5.0",
    "librosa>=0.9.0",
    "mido>=1.2.10",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "nicegui>=3.0",
    "imageio-ffmpeg>=0.4.9",
    # numba/llvmlite (via librosa) stopped publishing Intel-Mac wheels after
    # these versions; newer ones would have to compile LLVM from source.
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite<0.46; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=0.10", "twine>=4.0"]

[project.scripts]
ms-music-gui = "ms_music.gui:main"

# Windowed launcher for desktop shortcuts: no console window on Windows,
# opens the GUI in the browser and quits when the tab is closed.
[project.gui-scripts]
ms-music = "ms_music.gui:main_app"

[project.urls]
Homepage = "https://github.com/mmattano/ms_music"
"Bug Reports" = "https://github.com/mmattano/ms_music/issues"
Source = "https://github.com/mmattano/ms_music"
Examples = "https://github.com/mmattano/ms_music/tree/main/examples"

[tool.setuptools]
packages = ["ms_music", "ms_music.gui"]
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "ms_music.__version__" }

[tool.setuptools.package-data]
"ms_music.gui" = ["assets/*"]
