# Run the test suite on every push and pull request. release.yml calls this
# workflow too, so a release is only published when the tests pass.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Run the tests
        run: python -m pytest -q
